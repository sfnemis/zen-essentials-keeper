<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; font-family: sans-serif; padding: 10px; background-color: #f9f9fb; color: #15141a; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #1c1b22; color: #fbfbfe; }
        }
        h2 { font-size: 16px; margin: 0 0 10px; }
        .tab-list { list-style: none; padding: 0; margin: 0; }
        .tab-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
        .tab-item:last-child { border-bottom: none; }
        .tab-checkbox { margin-right: 10px; }
        .tab-info { flex-grow: 1; overflow: hidden; }
        .tab-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
        .tab-url { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; opacity: 0.7; }
        .empty-state { font-size: 13px; color: #888; text-align: center; padding: 20px 0; }
        .save-status { margin-top: 10px; font-size: 12px; color: green; text-align: center; height: 16px; }
    </style>
</head>
<body>
    <h2>Essential Tabs Manager</h2>
    <div id="tabList" class="tab-list"></div>
    <div id="status" class="save-status"></div>
    <script src="popup.js"></script>
</body>
</html>
